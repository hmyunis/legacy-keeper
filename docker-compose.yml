services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legacy_user
      POSTGRES_PASSWORD: legacy_pass
      POSTGRES_DB: legacy_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 legacy_keeper.wsgi:application
    volumes:
      - .:/app
    env_file:
      - backend/.env.docker
    depends_on:
      - db
      - redis
      - minio

  celery:
    build: .
    command: celery -A legacy_keeper worker -l INFO -Q high_priority,default,low_priority
    volumes:
      - .:/app
    env_file:
      - backend/.env.docker
    depends_on:
      - db
      - redis
      - minio

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  db_data:
  redis_data:
  minio_data:
  static_volume: