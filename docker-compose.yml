services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legacy_user
      POSTGRES_PASSWORD: legacy_pass
      POSTGRES_DB: legacy_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb -p local/legacykeeper || true;
      /usr/bin/mc anonymous set public local/legacykeeper;
      exit 0;
      "

  web:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 4 --worker-class gthread --timeout 600 --graceful-timeout 120 --keep-alive 75 legacy_keeper.wsgi:application
    volumes:
      - ./backend:/app
      - static_volume:/app/static
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
      - redis
      - minio
      - minio-init
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  celery:
    build: ./backend
    command: celery -A legacy_keeper.celery:app worker -l INFO -Q high_priority,default,low_priority
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
      - redis
      - minio
      - minio-init

  celery-beat:
    build: ./backend
    command: celery -A legacy_keeper.celery:app beat -l INFO
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_BASE_URL=http://localhost/api
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  db_data:
  redis_data:
  minio_data:
  static_volume:
